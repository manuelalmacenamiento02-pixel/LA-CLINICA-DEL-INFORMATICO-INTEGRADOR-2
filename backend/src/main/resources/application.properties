spring.application.name=clinica-api
server.port=8080
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/clinica_informatica}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.flyway.locations=classpath:db/migration
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.error.include-message=never
clinica.bootstrap.username=${ADMIN_USERNAME:admin}
clinica.bootstrap.password=${ADMIN_PASSWORD:}
spring.ai.google.genai.api-key=${GEMINI_API_KEY:}
spring.ai.google.genai.chat.options.model=${GEMINI_MODEL:gemini-3.8-flash}
spring.ai.google.genai.chat.options.temperature=0.2
clinica.ai.timeout-ms=${GEMINI_TIMEOUT_MS:120000}
clinica.backup.directory=${CLINICA_BACKUP_DIR:${user.home}/clinica-backups}
clinica.backup.pg-dump=${PG_DUMP_PATH:pg_dump}
clinica.backup.schedule=${CLINICA_BACKUP_CRON:0 0 2 * * *}
clinica.backup.schedule-zone=${CLINICA_BACKUP_TIME_ZONE:UTC}
clinica.backup.retention-days=${CLINICA_BACKUP_RETENTION_DAYS:30}
spring.autoconfigure.exclude=org.springframework.ai.model.google.genai.autoconfigure.chat.GoogleGenAiChatAutoConfiguration,org.springframework.ai.model.google.genai.autoconfigure.embedding.GoogleGenAiEmbeddingConnectionAutoConfiguration,org.springframework.ai.model.google.genai.autoconfigure.embedding.GoogleGenAiTextEmbeddingAutoConfiguration
